name: I have an idea
description: Something Oxipod could do, or do better
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Oxipod to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What would that help with?
      description: What are you trying to do with your iPod?
    validations:
      required: false
