name: Something doesn't work
description: Oxipod crashed, showed an error, or did something odd
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Oxipod, and sorry something went wrong! A few details make it much easier to find out why.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did Oxipod do? A screenshot is welcome.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: How can I make it happen too?
      description: The steps, if you know them.
      placeholder: |
        1. Plug in the iPod
        2. Open it in Oxipod
        3. ...
    validations:
      required: false

  - type: textarea
    id: troubleshooting
    attributes:
      label: Troubleshooting info
      description: |
        On the list of iPods, open the main menu (the three lines at the top right), choose About Oxipod, then Troubleshooting, and copy the text. It has your Oxipod version, your system and the iPods that are plugged in. It leaves out names and paths.
      render: text
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Oxipod?
      options:
        - The Flatpak file from the releases page
        - I built it from the source
        - Something else
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: What the terminal says
      description: |
        If you can, start Oxipod from a terminal (`flatpak run io.github.nyxn3t.Oxipod`) and paste what it prints around the time of the problem.
      render: shell
    validations:
      required: false
