[package]
name = "oxipod"
version = "0.6.0"
edition = "2024"
description = "Put music on your old iPod"
license = "GPL-3.0-or-later"
repository = "https://github.com/nyxn3t/Oxipod"
keywords = ["ipod", "music", "gtk", "libgpod"]
categories = ["multimedia::audio"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[build-dependencies]
bindgen = "0.73.2"
pkg-config = "0.3.34"
